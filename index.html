<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리의 신혼생활은 어떤 모습일까?</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700;900&display=swap');:root{--rose:#bf756c;--ink:#443737;--muted:#93847f;--line:#eadbd5}*{box-sizing:border-box}body{margin:0;background:#f9f3ef;color:var(--ink);font-family:'Noto Sans KR',sans-serif}main{max-width:470px;min-height:100vh;margin:auto;background:#fffaf7;box-shadow:0 12px 65px #6e4d3920;padding:32px 25px 48px}.eyebrow{font:700 11px 'DM Sans';letter-spacing:3px;color:var(--rose)}h1,h2,h3{font-family:'Noto Serif KR',serif;line-height:1.5}h1{font-size:36px;margin:28px 0 12px;letter-spacing:-1.8px}h2{font-size:25px;margin:16px 0 20px}p{line-height:1.9;color:#7e6f69;font-size:14px}.hero{min-height:76vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.ornament{font-size:52px;color:#e0a99c;margin-bottom:15px}.pill{background:#f5e7df;color:#ae7066;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:600;display:inline-block}button{cursor:pointer;font:inherit}.primary{border:0;border-radius:15px;background:#bc766d;color:white;padding:17px;width:100%;font-weight:700;margin-top:18px}.secondary{border:1px solid var(--line);background:white;border-radius:14px;padding:14px;color:var(--ink);width:100%}.choice{display:block;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:18px 16px;margin:12px 0;font-size:15px;line-height:1.65;color:var(--ink)}.choice:active,.choice:hover{border-color:var(--rose);background:#fdf1ec}.letter{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#f7e9e2;color:#b46e64;margin-right:8px;font-weight:700}.progress{height:5px;background:#eee2dc;border-radius:20px;overflow:hidden;margin:16px 0 36px}.bar{height:100%;background:#bc766d;transition:width .2s}.step{color:var(--rose);font-size:12px;font-weight:700}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:white;margin:12px 0}.card h3{margin:4px 0 8px;font-size:19px}.card p{margin:0}.tag{display:inline-block;padding:6px 11px;background:#f8e8e1;border-radius:20px;font-size:12px;color:#aa6d63;margin:4px 5px 4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{padding:14px}.grid h3{font-size:17px}label{font-size:13px;display:block;margin-top:15px;font-weight:600}input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);padding:15px;border-radius:12px;background:white;font:inherit;margin-top:8px}input[type=checkbox]{accent-color:#bd756b}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;font-weight:400;line-height:1.7}.check input{margin-top:4px}.back{border:0;background:none;color:#9b7770;padding:10px 0}.small{font-size:12px;color:#a2928a}.hide{display:none!important}footer{margin-top:38px;text-align:center;font-size:11px;color:#ae9c94}</style></head><body><main><div id="app"></div><footer>LG전자 베스트샵 일도점 · WEDDING STORY</footer></main><script>
const questions=[
['모처럼 아무 약속 없는 토요일!','집에서 밀린 드라마를 보며 푹 쉬고 싶어요','일단 나가고 싶어요! 재미있는 일을 찾아볼래요'],
['여행을 떠나기 전날 밤, 나는?','일정부터 준비물까지 미리 챙겨두는 편이에요','짐은 금방 싸요! 필요한 것만 챙기면 돼요'],
['갑자기 친구가 우리 집에 놀러 온다면?','좋아요! 맛있는 것도 준비해서 제대로 놀고 싶어요','좋지만, 우리끼리 쉬는 시간도 소중해요'],
['주말에 마트에 간 우리, 장바구니는?','일주일 먹을 것까지 든든하게 채워야 해요','오늘 먹고 싶은 것만 가볍게 담을래요'],
['냉장고를 열었을 때 가장 행복한 순간은?','먹을 게 종류별로 넉넉하게 있을 때예요','딱 필요한 재료만 깔끔하게 있을 때예요'],
['퇴근하고 배가 고픈 저녁, 우리 집 식탁은?','집밥파예요! 직접 요리해서 먹는 게 좋아요','외식·배달파예요! 맛있는 건 사 먹는 게 최고예요'],
['주말에 밀린 집안일이 한가득! 나는?','날 잡아서 한꺼번에 끝내는 게 속 시원해요','조금씩 나눠서 하는 게 부담 없어요'],
['하루를 보내다 보면 나는?','해야 할 일을 하나씩 챙겨서 끝내는 편이에요','다른 일에 집중하다 보면 하던 일을 깜빡할 때가 있어요'],
['모처럼 쉬는 날, 집이 조금 어질러져 있다면?','일단 정리부터 하고 쉬어야 해요','오늘 하루쯤은 그냥 편하게 쉬고 싶어요'],
['욕실에 있는 칫솔이나 샤워타월, 나는?','교체할 때가 되면 미리미리 바꾸는 편이에요','쓰는 데 문제없으면 조금 더 사용하는 편이에요'],
['나의 하루의 끝은?','퇴근하면 휴식 시작! 최대한 편하게 쉬고 싶어요','집에 오면 할 일이 보여요! 이것저것 끝내야 마음이 편해요'],
['나는 옷을 살 때?','좋은 옷을 하나 사서 오래 입는 걸 좋아해요','매 시즌 새로운 옷을 사는 걸 좋아해요'],
['한 번 입었지만 아직 세탁하기엔 애매한 옷, 나는?','바로 빨기는 아까워서 잘 걸어두고 다시 입어요','한 번 입은 옷은 웬만하면 세탁하는 편이에요'],
['추운 겨울 아침, 씻으러 들어갈 때 나는?','따뜻한 물이 나올 때까지 기다렸다가 들어가요','추워도 일단 들어가요! 빨리 씻고 나오면 돼요'],
['카페에 가면 나의 커피 취향은?','얼죽아예요! 추워도 시원한 아이스커피가 좋아요','뜨아파예요! 따뜻한 커피 한 잔이 최고예요'],
['마음에 드는 물건을 발견했다면?','여러 곳을 비교해 보고 사야 마음이 편해요','마음에 들면 오래 고민하지 않고 사는 편이에요'],
['새로운 물건을 고를 때 더 끌리는 건?','기능이 좋고 사용하기 편한 물건이요','디자인이 예쁘고 제 취향에 맞는 물건이요'],
['모처럼 집에서 여유로운 시간이 생긴다면?','좋아하는 영화나 드라마를 보면서 푹 쉬고 싶어요','평소 하고 싶었던 취미나 관심사를 즐기고 싶어요'],
['나의 생활 방식에 더 가까운 것은?','돈을 조금 더 쓰더라도 여유 시간을 갖는 게 좋아요','시간을 조금 더 쓰더라도 돈을 아끼는 게 좋아요'],
['하루에 자유시간이 딱 한 시간 더 생긴다면?','둘이 함께 좋아하는 일을 하고 싶어요','온전히 나만을 위한 시간을 갖고 싶어요']];
const products=['STEM 얼음정수 냉장고','식기세척기','워시콤보','로봇청소기','스타일러','바스에어','OLED TV','스탠바이미','김치냉장고','드로어 냉장고','인덕션','광파오븐'];
const rules=[
{0:{'OLED TV':3,'스탠바이미':3}},
{},
{0:{'STEM 얼음정수 냉장고':3,'식기세척기':3}},
{0:{'김치냉장고':3,'드로어 냉장고':2}},
{0:{'김치냉장고':3,'드로어 냉장고':2}},
{0:{'인덕션':3,'광파오븐':3,'드로어 냉장고':2,'식기세척기':1}},
{0:{'워시콤보':1},1:{'로봇청소기':1}},
{1:{'워시콤보':2}},
{0:{'로봇청소기':2,'식기세척기':2},1:{'로봇청소기':2,'식기세척기':2}},
{0:{'바스에어':1}},
{0:{'워시콤보':2,'로봇청소기':2,'식기세척기':2},1:{'워시콤보':1,'로봇청소기':1}},
{0:{'스타일러':3}},
{0:{'스타일러':3},1:{'워시콤보':1}},
{0:{'바스에어':4}},
{0:{'STEM 얼음정수 냉장고':3}},
{},
{},
{0:{'OLED TV':3,'스탠바이미':2},1:{'스타일러':1,'스탠바이미':1}},
{0:{'워시콤보':3,'로봇청소기':3,'식기세척기':3}},
{}];
const state={page:'home',person:0,index:0,names:['',''],answers:[[],[]]};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(s,fn,cl='primary'){return `<button class="${cl}" onclick="${fn}">${s}</button>`}function render(){let h='';if(state.page==='home')h=`<section class="hero"><div class="eyebrow">OUR NEWLYWED STORY</div><div class="ornament">♡ ✳</div><span class="pill">두 사람이 함께 만드는 우리 집 이야기</span><h1>우리의<br>신혼생활은<br>어떤 모습일까?</h1><p>같은 집, 서로 다른 취향.<br>스무 가지 질문으로 발견하는 우리 둘의 일상.</p>${btn('우리 이야기 시작하기','start()')}<p class="small">신랑님 20문항 → 신부님 20문항 → 두 분의 결과</p></section>`;
if(state.page==='names')h=`<div class="eyebrow">FIRST, YOUR NAMES</div><h2>우리 둘을<br>소개해 주세요 ♡</h2><p>이름을 입력하면 서로의 답변을 비교해 볼 수 있어요.</p><label>신랑 이름 (별명·애칭도 좋아요)<input id="groom" type="text" maxlength="20" placeholder="신랑 이름 또는 애칭" value="${esc(state.names[0])}"></label><label>신부 이름 (별명·애칭도 좋아요)<input id="bride" type="text" maxlength="20" placeholder="신부 이름 또는 애칭" value="${esc(state.names[1])}"></label>${btn('신랑님부터 시작할게요','saveNames()')}`;
if(state.page==='handoff')h=`<div class="eyebrow">YOUR TURN, BRIDE</div><div class="ornament">♡</div><h2>${esc(state.names[0])}님의 답변 완료!</h2><p>이제 휴대폰을 ${esc(state.names[1])}님에게 건네주세요.<br>똑같은 질문에 각자의 취향대로 답해 주세요.</p>${btn('신부님 질문 시작하기','nextPerson()')}`;
if(state.page==='quiz'){let q=questions[state.index],person=state.names[state.person];h=`<div class="eyebrow">OUR NEWLYWED STORY</div><p class="step">${esc(person)}님의 이야기 · ${state.index+1} / 20</p><div class="progress"><div class="bar" style="width:${(state.index+1)*5}%"></div></div><span class="pill">${state.index<3?'우리의 일상':state.index<6?'먹고사는 즐거움':state.index<9?'집안일과 생활 습관':state.index<15?'생활 속 작은 습관':'우리 집의 행복 기준'}</span><h2>${esc(q[0])}</h2>${[1,2].map((n,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${i?'B':'A'}</span>${esc(q[n])}</button>`).join('')}<button class="back" onclick="goBack()">← 이전 질문</button>`}
if(state.page==='results'){let a=analyze(state.answers[0]),b=analyze(state.answers[1]),joint=analyzeCouple(),same=state.answers[0].filter((x,i)=>x===state.answers[1][i]).length;let match=same>=14?'찰떡콩떡 부부':same>=8?'알콩달콩 조화 부부':'매력이 다른 보완 부부';let ice=state.answers[0][14]===0&&state.answers[1][14]===0;h=`<div class="eyebrow">OUR STORY, TOGETHER</div><h2>${esc(state.names[0])} ♡ ${esc(state.names[1])}<br>${match}</h2><p>서로 닮은 취향도, 다른 습관도 모여서 우리만의 신혼생활이 만들어져요.</p>${ice?'<span class="tag">🧊 우리 부부는 얼죽아 동맹!</span>':''}<div class="card"><div class="eyebrow">OUR TOP 3</div><h3>우리 부부 추천가전 TOP 3</h3>${joint.map((p,i)=>`<p>${i+1}. ${esc(p)} ${a.top.includes(p)&&b.top.includes(p)?'♡ 우리 둘 다 탐내는 가전!':''}</p>`).join('')}</div><div class="grid"><div class="card"><div class="eyebrow">GROOM</div><h3>${esc(state.names[0])}</h3><p>${esc(a.type)}</p>${a.top.map((p,i)=>`<p>${i+1}. ${esc(p)}</p>`).join('')}</div><div class="card"><div class="eyebrow">BRIDE</div><h3>${esc(state.names[1])}</h3><p>${esc(b.type)}</p>${b.top.map((p,i)=>`<p>${i+1}. ${esc(p)}</p>`).join('')}</div></div><div class="card"><h3>우리의 생활 취향</h3><p>${same>=10?'닮은 선택이 많아서 일상 속 공감대가 풍부한 두 사람이에요.':'서로 다른 선택이 새로운 생활 방식을 발견하게 해 줄 두 사람이에요.'} 서로의 방식을 알아가는 재미를 즐겨보세요.</p></div>${btn('컴포즈커피 아메리카노 이벤트 응모하기','toEvent()')}<p class="small">추천은 답변에 기반한 재미있는 라이프스타일 제안이며, 제품 구매를 전제로 하지 않습니다.</p>`}
if(state.page==='event')h=`<div class="eyebrow">A LITTLE GIFT FOR YOU</div><h2>우리의 이야기를 마쳤다면,<br>커피 한 잔의 기회 ☕</h2><p>컴포즈커피 아메리카노 이벤트 응모하기 화면이야. 실제 이벤트 진행 시에는 지급 방식, 인원, 기간, 개인정보 처리방침을 확정해 안내해야 합니다.</p><div class="card"><p><b>현재는 시연용 화면</b>으로, 개인정보를 수집하거나 전송하지 않습니다.</p><p>Google Sheets 연결과 개인정보 안내가 준비되면 응모 기능을 활성화할 수 있습니다.</p></div>${btn('결과 화면으로 돌아가기','backResult()','secondary')}`;
app.innerHTML=h}function start(){state.page='names';render()}function saveNames(){let a=document.getElementById('groom').value.trim(),b=document.getElementById('bride').value.trim();if(!a||!b){alert('두 분의 이름을 모두 입력해 주세요.');return}state.names=[a,b];state.page='quiz';render()}function answer(v){state.answers[state.person][state.index]=v;if(state.index<19)state.index++;else if(state.person===0)state.page='handoff';else state.page='results';render();window.scrollTo(0,0)}function goBack(){if(state.index>0){state.index--;render()}}function nextPerson(){state.person=1;state.index=0;state.page='quiz';render()}function score(ans){let s=Object.fromEntries(products.map(p=>[p,0]));ans.forEach((v,i)=>{let r=rules[i]||{},map=r[v]||{};Object.entries(map).forEach(([p,n])=>s[p]+=n)});return s}function ranked(s){return Object.entries(s).sort((a,b)=>b[1]-a[1]||products.indexOf(a[0])-products.indexOf(b[0])).map(x=>x[0])}function analyze(ans){let s=score(ans);let type=ans[0]===0?'포근한 집콕형':ans[2]===0?'북적북적 홈파티형':ans[16]===1?'감성 가득 카페형':ans[18]===0?'똑똑한 스마트형':'자유로운 모험형';return {type,top:ranked(s).slice(0,3)}}function analyzeCouple(){let a=score(state.answers[0]),b=score(state.answers[1]);return ranked(Object.fromEntries(products.map(p=>[p,a[p]+b[p]]))).slice(0,3)}function toEvent(){state.page='event';render();window.scrollTo(0,0)}function backResult(){state.page='results';render()}render();
</script></body></html>
