:root{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:#403b3a;background:#fff8f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:540px;margin:auto;min-height:100dvh;padding:20px 20px 85px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-weight:800;font-size:13px;letter-spacing:-.3px}.brand span{color:#d77e7b}.tiny{font-size:12px;color:#9d8580}.hero{text-align:center;padding:28px 10px 20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:3px;color:#c17c76}.hero h1{font-size:clamp(30px,8vw,42px);letter-spacing:-2px;line-height:1.35;margin:15px 0}.hero p{line-height:1.8;color:#826f6b;font-size:14px}.heart{font-size:58px;margin:18px 0;filter:drop-shadow(0 8px 10px #ebd6d0)}.card{background:#fff;border:1px solid #f1e5e1;border-radius:24px;padding:23px;box-shadow:0 14px 38px #9d6c6310;margin:16px 0}.field{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input,select{width:100%;border:1px solid #e8d9d5;border-radius:13px;background:#fffcfb;padding:14px;font:inherit;font-size:15px;outline-color:#d77e7b}.btn{width:100%;border:0;border-radius:16px;background:#d77e7b;color:#fff;padding:16px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#f9e9e5;color:#a7605e}.btn.ghost{background:transparent;border:1px solid #e9d6d0;color:#9c6964}.row{display:flex;gap:10px}.row>*{flex:1}.small{font-size:12px;color:#8c7974;line-height:1.7}.muted{color:#8c7974}.center{text-align:center}.pill{display:inline-block;padding:7px 11px;border-radius:99px;background:#fae8e4;color:#b7736e;font-size:12px;font-weight:800}.progress{height:7px;background:#f6e8e3;border-radius:20px;overflow:hidden;margin:15px 0 27px}.bar{height:100%;background:#d77e7b;transition:width .2s}.question{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.5;margin:20px 0 25px}.option{width:100%;text-align:left;border:1px solid #eadbd5;background:#fff;border-radius:18px;padding:18px;margin:7px 0;font-size:15px;line-height:1.6;cursor:pointer;color:#493e3b}.option:hover,.option:focus{border-color:#d77e7b;background:#fff5f2}.optlabel{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:#f9e9e5;color:#bf7971;font-weight:800;margin-right:9px}.section{font-size:11px;font-weight:800;letter-spacing:1px;color:#bb8580}.result-head{text-align:center;background:linear-gradient(145deg,#fff,#ffefea);border:1px solid #f4dfd9;border-radius:26px;padding:26px 17px}.result-head h2{font-size:27px;line-height:1.4;margin:14px 0}.result-head p{font-size:14px;color:#806f69;line-height:1.8}.three{display:grid;gap:9px}.rec{padding:14px;background:#fff8f5;border:1px solid #f1e6e2;border-radius:13px}.rec strong{display:block;font-size:15px}.rec span{display:block;font-size:12px;color:#8e7770;margin-top:5px;line-height:1.6}.divider{height:1px;background:#f0e4df;margin:20px 0}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#776965;line-height:1.6;margin:13px 0}.check input{width:17px;height:17px;margin:2px 0 0;flex:none;accent-color:#d77e7b}.code{font-size:32px;letter-spacing:5px;font-weight:900;color:#a75f60;margin:15px 0}.status{padding:12px 14px;background:#fff4e9;border-radius:12px;font-size:13px;line-height:1.7;color:#8e6e58;margin-top:12px}.hide{display:none!important}.footer{text-align:center;font-size:11px;color:#a38c87;margin-top:30px}.tag{display:inline-block;background:#f9ede9;border-radius:7px;padding:4px 7px;margin:3px;font-size:12px;color:#9c6d65}.share{font-size:13px;line-height:1.7;overflow-wrap:anywhere}.mini-title{font-size:17px;font-weight:850;letter-spacing:-.5px;margin:0 0 10px}
</style></head><body><main class="shell"><header class="top"><div class="brand">LG전자 베스트샵 <span>일도점</span></div><div class="tiny">WEDDING EXPO · COUPLE TEST</div></header><div id="app"></div><footer class="footer">우리 둘의 신혼집 취향 테스트 · 일도점</footer></main><script>
/* 서버를 연결하려면 이 주소에 배포한 Google Apps Script 웹 앱 URL을 입력하세요. */
const API_URL='';
const QUESTIONS=[
['일상','모처럼 아무 약속 없는 토요일!','집에서 밀린 드라마 보며 푹 쉬어야지','일단 나가자! 뭐라도 재밌는 일 없을까?','home','active'],
['일상','여행을 떠나기 전날 밤, 나는?','일정부터 준비물까지 미리 챙겨둔다','짐은 금방 싸지! 그날 기분이 더 중요해','plan','free'],
['일상','갑자기 친구가 우리 집에 놀러 온다면?','좋아! 맛있는 것도 준비해서 제대로 놀자','좋긴 한데, 우리끼리 쉬는 시간도 소중해','host','quiet'],
['식생활','주말에 마트에 간 우리, 장바구니는?','일주일 먹을 것까지 든든하게 채워야지','오늘 먹고 싶은 것만 가볍게 담자','bulk','small'],
['식생활','냉장고를 열었을 때 가장 행복한 순간은?','먹을 게 종류별로 넉넉하게 있을 때','딱 필요한 재료만 깔끔하게 있을 때','stock','minimal'],
['식생활','퇴근하고 배가 고픈 저녁, 우리 집 식탁은?','집밥파! 직접 요리해서 먹는 게 제일 좋아','외식·배달파! 맛있는 건 사 먹는 게 최고지','cook','delivery'],
['생활습관','집안일을 하다가 재밌는 드라마가 시작됐다!','하던 건 마무리해야 마음이 편하지','일단 드라마부터! 나머지는 나중에','finish','switch'],
['생활습관','할 일을 깜빡한 걸 뒤늦게 알았을 때 나는?','이런 일이 없게 알림이나 메모를 해둔다','아차! 가끔 잊어버리는 것도 사람 사는 거지','remind','forget'],
['생활습관','모처럼 쉬는 날, 집이 조금 어질러져 있다면?','일단 정리부터 하고 쉬어야지','오늘 하루쯤은 그냥 편하게 쉬자','tidy','relax'],
['패션','마음에 쏙 드는 옷을 발견했다면?','좋은 옷 하나 사서 오래 입는 게 좋아','새로운 스타일을 시도하는 게 즐거워','lasting','variety'],
['패션','외출하고 돌아와 벗은 옷은?','다음에도 입을 수 있게 잘 걸어둔다','일단 편한 옷으로 갈아입는 게 먼저!','care','casual'],
['패션','옷장을 열었을 때 나의 모습은?','자주 입는 옷이 어느 정도 정해져 있어','오늘은 뭘 입지? 매일 고민하는 편','repeat','fashion'],
['취향','큰돈을 쓰기 전에 나는?','필요한지, 오래 쓸지 꼼꼼하게 따져봐','마음에 쏙 들면 만족감도 중요하지','practical','delight'],
['취향','새로운 물건을 고를 때 더 끌리는 건?','기능이 좋고 사용하기 편한 물건','디자인이 예쁘고 내 취향에 맞는 물건','function','design'],
['취향','우리 집에서 가장 기대되는 순간은?','둘이 소파에 앉아 편안하게 쉬는 저녁','함께 맛있는 음식 만들고 이야기하는 시간','sofa','kitchen']
];
const PRODUCTS={combo:['워시콤보','하던 일을 잊기 쉬운 생활 리듬에 세탁·건조의 중간 단계를 줄이는 선택'],tower:['워시타워','정해진 루틴에 따라 빨래를 관리하는 생활에 어울리는 선택'],robot:['로봇청소기','일상 속 바닥 청소 부담을 덜어주는 선택'],dish:['식기세척기','식사 후 정리를 더 간편하게 돕는 선택'],drawer:['드로어 냉장고','자주 꺼내 쓰는 식재료와 주방 동선을 고려한 선택'],kimchi:['김치냉장고','넉넉히 장을 보는 습관에 어울리는 식재료 보관 선택'],induction:['인덕션','집에서 요리하는 시간을 즐기는 생활에 어울리는 선택'],oven:['광파오븐','집밥 준비부터 간편한 데우기까지 활용하는 선택'],styler:['스타일러','아끼는 옷을 자주 입고 관리하는 생활에 어울리는 선택'],tv:['OLED TV','둘이 함께 보내는 영화와 휴식 시간을 위한 선택'],stanby:['스탠바이미','공간을 옮겨 다니며 콘텐츠를 즐기는 생활에 어울리는 선택'],ice:['얼음정수 냉장고','손님 초대와 집에서의 음료 시간을 즐기는 생활에 어울리는 선택']};
const TYPES=[['포근한 집콕형','home'],['자유로운 모험형','active'],['깔끔한 호텔형','tidy'],['감성 가득 카페형','design'],['똑똑한 스마트형','function'],['북적북적 홈파티형','host'],['알뜰살뜰 실속형','practical'],['느긋한 힐링형','relax']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');let session=null,role=null,step=0,answers=[];let poll=null;
const key=c=>'couplequiz_'+c;const randomCode=()=>{const x=new Uint32Array(2);crypto.getRandomValues(x);return Array.from(x,v=>v.toString(36).toUpperCase().padStart(6,'0')).join('').slice(0,8)};
function readLocal(c){try{return JSON.parse(localStorage.getItem(key(c)))}catch{return null}}function saveLocal(s){localStorage.setItem(key(s.code),JSON.stringify(s))}
function getCode(){return new URLSearchParams(location.search).get('code')||''}
function view(html){app.innerHTML=html;scrollTo({top:0,behavior:'instant'})}
function home(){clearInterval(poll);view(`<section class="hero"><div class="eyebrow">OUR NEWLYWED HOME</div><div class="heart">🏡💗</div><h1>우리 둘이 살면<br>어떤 집이 될까?</h1><p>같은 질문, 서로 다른 취향!<br>우리만의 신혼집 라이프스타일을 발견해 봐요.</p><span class="pill">각자 15문항 · 맞춤 가전 추천</span></section><div class="card"><h3 class="mini-title">우리 커플 시작하기</h3><label class="field" for="groom">예랑이 이름</label><input id="groom" maxlength="15" placeholder="예: 민준" autocomplete="off"><label class="field" for="bride">예신이 이름</label><input id="bride" maxlength="15" placeholder="예: 서연" autocomplete="off"><button class="btn" id="create">우리 커플 테스트 시작하기 →</button><div class="divider"></div><h3 class="mini-title">상대방이 먼저 시작했나요?</h3><p class="small">공유받은 커플 코드를 입력하면 각자 휴대폰에서 이어서 참여할 수 있어요.</p><input id="joincode" placeholder="커플 연결코드 8자리" maxlength="8" style="text-transform:uppercase" value="${esc(getCode())}"><button class="btn secondary" id="join">커플 코드로 참여하기</button></div>`);$('#create').onclick=()=>{const groom=$('#groom').value.trim(),bride=$('#bride').value.trim();if(!groom||!bride)return alert('두 사람의 이름을 입력해 주세요.');if(groom===bride)return alert('두 사람의 이름을 구분해서 입력해 주세요.');session={code:randomCode(),groom,bride,createdAt:new Date().toISOString(),answers:{}};saveLocal(session);syncCreate(session).finally(choose)};$('#join').onclick=()=>join($('#joincode').value.trim().toUpperCase())}
async function request(op,payload){if(!API_URL)throw Error('서버 미연결');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op,...payload})});if(!r.ok)throw Error('서버 연결 실패');const j=await r.json();if(!j.ok)throw Error(j.error||'요청 실패');return j}
async function syncCreate(s){if(!API_URL)return;try{await request('create',{code:s.code,groom:s.groom,bride:s.bride})}catch(e){alert('온라인 연결에 실패했어요. 이 기기에서 이어서 진행할 수 있지만 다른 휴대폰과 연결하려면 서버 설정을 확인해 주세요.') }}
async function join(code){if(!/^[A-Z0-9]{8}$/.test(code))return alert('8자리 커플 코드를 입력해 주세요.');let s=readLocal(code);if(API_URL){try{const r=await request('get',{code});s=r.session;saveLocal(s)}catch(e){if(!s)return alert('커플을 찾을 수 없어요. 코드를 확인해 주세요.')}}if(!s)return alert('이 휴대폰에 저장된 커플이 아니에요. 서로 다른 휴대폰에서 연결하려면 온라인 서버 설정이 필요해요.');session=s;choose()}
function shareText(){return `${session.groom} ♥ ${session.bride}의 신혼집 취향 테스트\n커플 연결코드: ${session.code}\n${location.origin+location.pathname}?code=${session.code}`}
function choose(){const g=!!session.answers.groom,b=!!session.answers.bride;view(`<div class="hero"><div class="eyebrow">TOGETHER, APART</div><h1>${esc(session.groom)} ♥ ${esc(session.bride)}</h1><p>각자의 취향을 알아보고<br>두 사람의 결과를 합쳐 볼까요?</p><div class="code">${esc(session.code)}</div><p class="small">이 코드를 상대방에게 공유해 주세요.</p></div><div class="card"><div class="row"><button class="btn secondary" id="copy">코드·링크 복사</button><button class="btn ghost" id="share">공유하기</button></div><div class="divider"></div><button class="btn ${g?'secondary':''}" id="groom">🤵 ${esc(session.groom)} · ${g?'완료 ✓':'15문항 시작 →'}</button><button class="btn ${b?'secondary':''}" id="bride">👰 ${esc(session.bride)} · ${b?'완료 ✓':'15문항 시작 →'}</button>${g&&b?'<button class="btn" id="result">💗 우리 둘의 결과 보기</button>':'<div class="status">한 사람이 먼저 끝나도 괜찮아요. 두 사람 모두 완료하면 커플 결과가 열려요.</div>'}${!API_URL?'<p class="small" style="margin-top:16px">현재는 같은 기기에서 순서대로 참여하는 체험 모드예요. 서로 다른 기기에서 연결하려면 서버 배포가 필요해요.</p>':''}</div>`);$('#groom').onclick=()=>start('groom');$('#bride').onclick=()=>start('bride');$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareText());alert('연결코드와 링크를 복사했어요.')}catch{prompt('아래 내용을 복사해 주세요.',shareText())}};$('#share').onclick=()=>{if(navigator.share)navigator.share({title:'우리 신혼집 취향 테스트',text:shareText()}).catch(()=>{});else $('#copy').click()};if(g&&b)$('#result').onclick=result;if(API_URL&&!(g&&b))poll=setInterval(refresh,7000)}
async function refresh(){if(!session||!API_URL)return;try{const r=await request('get',{code:session.code});if(JSON.stringify(r.session.answers)!==JSON.stringify(session.answers)){session=r.session;saveLocal(session);if(!role)choose()}}catch{}}
function start(r){clearInterval(poll);role=r;step=0;answers=[];question()}
function question(){const q=QUESTIONS[step];view(`<div class="row" style="align-items:center"><span class="pill">${role==='groom'?'🤵 '+esc(session.groom):'👰 '+esc(session.bride)}</span><span class="small" style="text-align:right">${step+1} / 15</span></div><div class="progress"><div class="bar" style="width:${(step+1)/15*100}%"></div></div><div class="section">${esc(q[0])} · QUESTION ${String(step+1).padStart(2,'0')}</div><div class="question">${esc(q[1])}</div><button class="option" id="a"><span class="optlabel">A</span>${esc(q[2])}</button><button class="option" id="b"><span class="optlabel">B</span>${esc(q[3])}</button><button class="btn ghost" id="back">← 이전 질문</button><p class="small center">정답은 없어요. 평소 나다운 답을 골라 주세요.</p>`);$('#a').onclick=()=>pick(0);$('#b').onclick=()=>pick(1);$('#back').onclick=()=>{if(step>0){step--;question()}else choose()}}
async function pick(v){answers[step]=v;if(step<14){step++;question();return}session.answers[role]=answers.slice();saveLocal(session);const r=role;role=null;if(API_URL){try{const resp=await request('submit',{code:session.code,role:r,answers:answers.slice()});session=resp.session||session;saveLocal(session)}catch(e){alert('온라인 답변 저장에 실패했어요. 이 기기에는 저장됐지만 다른 휴대폰에 반영되지 않을 수 있어요.')}}choose()}
function tags(a){return a.map((v,i)=>QUESTIONS[i][4+v])}
function score(a){const t=tags(a),s=Object.fromEntries(Object.keys(PRODUCTS).map(k=>[k,0]));const add=(id,n)=>s[id]+=n;const has=x=>t.includes(x);if(has('home')){add('tv',4);add('stanby',2)}if(has('active'))add('stanby',3);if(has('host')){add('ice',4);add('dish',2)}if(has('quiet'))add('tv',1);if(has('bulk')){add('kimchi',4);add('drawer',2)}if(has('small'))add('drawer',3);if(has('stock')){add('kimchi',4);add('ice',1)}if(has('minimal'))add('drawer',2);if(has('cook')){add('induction',5);add('drawer',4);add('oven',4);add('dish',3)}if(has('delivery')){add('oven',3);add('dish',1)}if(has('finish')){add('tower',3);add('dish',1)}if(has('switch')){add('combo',4);add('robot',3)}if(has('remind'))add('tower',2);if(has('forget')){add('combo',5);add('robot',3)}if(has('tidy')){add('robot',4);add('dish',4)}if(has('relax')){add('robot',3);add('dish',2)}if(has('lasting'))add('styler',3);if(has('variety'))add('styler',1);if(has('care'))add('styler',5);if(has('repeat'))add('styler',2);if(has('fashion'))add('styler',1);if(has('function')){add('robot',1);add('combo',1)}if(has('design')){add('drawer',1);add('tv',1)}if(has('sofa')){add('tv',4);add('stanby',2)}if(has('kitchen')){add('induction',3);add('oven',2);add('dish',2);add('drawer',2)}return s}
function ranked(s){return Object.keys(s).sort((a,b)=>s[b]-s[a])}
function type(a){const t=tags(a);const weights={home:t.includes('home')*2+t.includes('sofa'),active:t.includes('active')*2+t.includes('free'),tidy:t.includes('tidy')*2+t.includes('plan'),design:t.includes('design')*2+t.includes('delight'),function:t.includes('function')*2+t.includes('remind'),host:t.includes('host')*2+t.includes('kitchen'),practical:t.includes('practical')*2+t.includes('bulk'),relax:t.includes('relax')*2+t.includes('quiet')};return TYPES.find(x=>x[1]===Object.keys(weights).sort((a,b)=>weights[b]-weights[a])[0])[0]}
function recommendations(ids,shared){return `<div class="three">${ids.map((id,i)=>`<div class="rec"><strong>${i+1}. ${PRODUCTS[id][0]} ${shared&&shared.includes(id)?'<span class="tag">우리 둘 다 탐내는 가전!</span>':''}</strong><span>${PRODUCTS[id][1]}</span></div>`).join('')}</div>`}
function result(){clearInterval(poll);const g=session.answers.groom,b=session.answers.bride;if(!g||!b)return choose();const gs=score(g),bs=score(b),sum={};for(const k of Object.keys(PRODUCTS))sum[k]=gs[k]+bs[k];const gr=ranked(gs).slice(0,3),br=ranked(bs).slice(0,3),cr=ranked(sum).slice(0,3);const same=gr.filter(x=>br.includes(x));const tg=tags(g),tb=tags(b);const agreement=g.filter((v,i)=>v===b[i]).length;const nickname=agreement>=11?'찰떡콩떡 취향 부부':agreement>=6?'서로를 닮아가는 균형 부부':'달라서 더 재밌는 반전 부부';const intro=agreement>=11?'일상의 작은 선택까지 통하는 두 사람! 함께 좋아하는 것을 발견하는 즐거움이 커요.':agreement>=6?'같은 취향도, 다른 취향도 있는 두 사람. 서로의 선택이 우리 집을 더 풍성하게 만들어요.':'취향은 달라도 함께라서 즐거운 두 사람! 서로 다른 생활 리듬이 새로운 아이디어가 될 거예요.';const overlaps=QUESTIONS.map((q,i)=>g[i]===b[i]?q[0]:null).filter(Boolean);view(`<div class="result-head"><div class="eyebrow">OUR COUPLE STORY</div><div class="heart">💑</div><h2>${esc(nickname)}</h2><p>${esc(session.groom)} ♥ ${esc(session.bride)}<br>${intro}</p></div><div class="card"><div class="row"><div><span class="section">🤵 ${esc(session.groom)}</span><h3>${esc(type(g))}</h3></div><div><span class="section">👰 ${esc(session.bride)}</span><h3>${esc(type(b))}</h3></div></div><p class="small">함께 고른 선택이 ${agreement}개, 서로 다른 선택이 ${15-agreement}개였어요. 어느 쪽이든 우리 둘만의 매력이에요.</p></div><div class="card"><h3 class="mini-title">🏡 우리 부부 추천가전 TOP 3</h3><p class="small">두 사람의 생활 습관을 함께 고려했어요.</p>${recommendations(cr,same)}</div><div class="card"><h3 class="mini-title">🤵 ${esc(session.groom)} 추천가전 TOP 3</h3>${recommendations(gr,same)}<div class="divider"></div><h3 class="mini-title">👰 ${esc(session.bride)} 추천가전 TOP 3</h3>${recommendations(br,same)}</div><div class="card"><h3 class="mini-title">☕ 컴포즈커피 아메리카노 이벤트</h3><p class="small">박람회 이벤트 신청을 원하시면 연락처를 남겨 주세요. 실제 증정 여부와 방법은 현장 안내를 확인해 주세요.</p><label class="field">연락처</label><input id="phone" type="tel" inputmode="tel" placeholder="010-1234-5678" maxlength="13"><label class="check"><input type="checkbox" id="consent"><span><b>[필수] 개인정보 수집·이용 동의</b><br>수집 항목: 전화번호, 예랑이·예신이 이름, 테스트 선택 답변 및 결과<br>이용 목적: 이벤트 신청 확인·제공 및 상담 요청 시 참고<br>보유 기간: 행사 종료 후 30일 이내 삭제 (관련 법령상 보관 의무가 있는 경우 제외)<br>동의 거부 가능하나 이벤트 신청은 제한됩니다.</span></label><label class="check"><input type="checkbox" id="marketing"><span>[선택] LG전자 베스트샵 일도점의 행사·상품 상담 관련 마케팅 연락에 동의합니다. 미동의해도 이벤트 신청이 가능합니다.</span></label><button class="btn" id="apply">이벤트 신청하기</button><div id="applymsg" class="status hide"></div></div><button class="btn ghost" id="restart">처음 화면으로</button><p class="small center">테스트는 재미를 위한 생활 취향 분석이에요. 실제 가전 선택은 공간·예산·사용량을 함께 확인해 주세요.</p>`);$('#apply').onclick=async()=>{const phone=$('#phone').value.replace(/\D/g,'');if(!/^01[016789]\d{7,8}$/.test(phone))return alert('휴대전화 번호를 확인해 주세요.');if(!$('#consent').checked)return alert('개인정보 수집·이용 동의가 필요해요.');if(!API_URL)return alert('아직 이벤트 접수 서버가 연결되지 않았어요. 현장 담당자에게 문의해 주세요.');const btn=$('#apply');btn.disabled=true;try{await request('lead',{code:session.code,phone,consent:true,marketing:$('#marketing').checked,houseType:nickname});$('#applymsg').classList.remove('hide');$('#applymsg').textContent='이벤트 신청이 접수됐어요. 참여해 주셔서 감사합니다!';btn.textContent='신청 완료 ✓'}catch(e){alert('신청을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.');btn.disabled=false}};$('#restart').onclick=home}
home();
