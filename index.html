const state={page:'home',person:0,index:0,names:['',''],answers:[[],[]]};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(s,fn,cl='primary'){return `<button class="${cl}" onclick="${fn}">${s}</button>`}function oldRender(){let h='';if(state.page==='home')h=`<section class="hero"><div class="eyebrow">OUR NEWLYWED STORY</div><div class="ornament">♡ ✳</div><span class="pill">두 사람이 함께 만드는 우리 집 이야기</span><h1>우리의<br>신혼생활은<br>어떤 모습일까?</h1><p>같은 집, 서로 다른 취향.<br>스무 가지 질문으로 발견하는 우리 둘의 일상.</p>${btn('우리 이야기 시작하기','start()')}<p class="small">신랑님 20문항 → 신부님 20문항 → 커피 응모 화면 → 결과 3페이지</p></section>`;

const profileInsights=[["편안함을 원하는 마음이 생활 선택의 기준이 될 수 있어요. 중요한 건 아무것도 하지 않는 게 아니라, 나를 충전하는 시간을 지킬 여유를 만드는 일이에요.","휴식은 무작정 쉬는 시간보다, 일상에서 신경 쓸 일을 덜어냈을 때 더 만족스러울 수 있어요."],["미리 챙기는 습관은 단순히 꼼꼼한 성격이라기보다, 예상치 못한 불편에 시간을 빼앗기고 싶지 않은 마음과 연결돼요.","준비를 잘하는 만큼, 반복되는 일은 체계적으로 정리해 두었을 때 생활이 한결 편해질 수 있어요."],["효율을 따지는 건 바쁘게 살고 싶어서라기보다, 번거로운 일에 에너지를 쓰지 않고 중요한 일에 집중하고 싶은 마음일 수 있어요.","생활 속 작은 수고를 줄이는 것이 곧 여유를 만드는 방법인 분에게 가까워요."],["가격만 보는 소비보다는, 들인 비용만큼 오래 만족할 수 있는지를 중요하게 여길 가능성이 커요.","지금의 편리함과 오래 쓸 가치를 함께 따져보는 방식이 신혼집을 꾸릴 때도 기준이 될 수 있어요."],["예쁘다는 이유만으로 선택하기보다, 매일 마주하는 공간과 물건이 내 취향을 잘 담아내길 바라는 마음이 읽혀요.","집의 기능뿐 아니라 그 안에서 느끼는 분위기까지 생활의 만족도를 좌우할 수 있어요."],["함께하는 시간을 소중하게 여긴다는 건, 집을 단순한 휴식처보다 관계를 쌓는 공간으로 생각할 가능성이 있다는 뜻이에요.","편리한 집만큼이나 둘이 자연스럽게 마주하고 이야기를 나눌 수 있는 환경이 중요해질 수 있어요."],["새로운 경험을 찾는 마음은 변화를 좋아한다는 말보다, 익숙한 일상 속에서도 발견할 거리를 남겨두고 싶다는 뜻에 가까워요.","집도 하나의 고정된 공간보다는 상황에 따라 다르게 즐길 수 있을 때 더 만족스러울 수 있어요."],["집안일을 챙기는 선택에는 단순히 부지런함보다, 생활이 안정적으로 돌아갈 때 느끼는 만족감이 담겨 있을 수 있어요.","손이 많이 가는 집보다, 돌보는 수고에 비해 일상이 편안하게 유지되는 집이 더 잘 맞을 수 있어요."]];
const profileCombinations=[["쉬는 시간을 지키려면 미리 정리해 둘 것이 무엇인지부터 생각하는 편일 수 있어요.","편하게 쉬고 싶기에 반복되는 집안일을 간단하게 만드는 선택에 끌릴 수 있어요.","여유를 중요하게 여기면서도 불필요한 지출은 줄이고 싶은 마음이 함께 보여요.","휴식의 질은 공간의 분위기와 사용감에도 영향을 받을 수 있어요.","혼자 충전하는 시간과 둘이 함께하는 시간을 모두 소중히 여길 수 있어요.","집 안에서 충분히 쉬되, 가끔은 새로운 자극으로 기분을 전환하는 방식이 어울려요.","집을 잘 돌보는 이유도 결국 그 안에서 마음 편히 쉬기 위해서일 수 있어요."],["계획을 세우는 목적이 바쁜 일정을 늘리는 것이 아니라, 쉬는 시간을 확보하는 데 있을 수 있어요.","준비는 꼼꼼히 하되 실행 과정은 최대한 간단하게 만들고 싶은 조합이에요.","당장 저렴한 선택보다 앞으로의 관리 비용까지 예상할 수 있는 선택에 마음이 갈 수 있어요.","분위기를 중요하게 생각하면서도 공간의 쓰임새는 미리 따져보고 싶어 할 수 있어요.","둘이 함께하는 시간을 더 잘 즐기기 위해 작은 준비를 아끼지 않을 수 있어요.","새로운 경험을 좋아하되 준비가 되어 있을 때 더 마음껏 즐길 수 있어요.","일상을 체계적으로 꾸리는 것과 직접 살림을 돌보는 즐거움이 만나는 조합이에요."],["시간을 아껴서 결국 충분히 쉬고 싶은 마음이 드러나요.","해야 할 일을 예측해 두고 실제 과정은 단순하게 만드는 데 만족을 느낄 수 있어요.","편리하다는 이유만으로 고르기보다, 아끼는 시간에 비해 비용이 적절한지도 따질 수 있어요.","기능과 디자인 중 하나만 고르기보다, 매일 편하게 쓰면서 보기에도 좋은 물건을 원할 수 있어요.","반복되는 일을 간소화해 둘이 함께할 시간을 늘리는 데 의미를 둘 수 있어요.","번거로운 일은 줄이고, 남는 에너지는 새로운 경험에 쓰고 싶어 할 수 있어요.","살림을 직접 챙기되 꼭 사람이 해야 할 일과 줄여도 되는 일을 구분하는 편일 수 있어요."],["꼭 필요한 곳에만 비용을 쓰고, 그 덕분에 마음 편히 쉬는 생활을 선호할 수 있어요.","계획적으로 비교하는 습관이 장기적으로 만족할 소비를 돕는 조합이에요.","절약 자체보다 시간을 아끼는 효과까지 따져 실속을 판단할 수 있어요.","오래 써도 질리지 않을 디자인과 활용도를 함께 고려할 수 있어요.","함께 쓰는 물건일수록 두 사람 모두에게 가치가 있는지 살피는 편일 수 있어요.","새로운 것을 시도하되 비용과 활용 가능성을 먼저 따져볼 수 있어요.","살림을 챙기면서도 관리 비용과 오래 쓸 수 있는지를 꼼꼼히 생각할 수 있어요."],["편안하게 쉬는 공간도 내 취향에 맞아야 비로소 온전히 쉬는 기분이 들 수 있어요.","마음에 드는 분위기를 만들기 위해 공간과 물건을 신중하게 계획할 수 있어요.","보기 좋은 것뿐 아니라 사용하기 편해야 오래 만족하는 조합이에요.","마음에 드는 물건이라도 오래 쓸 수 있는지 살피는 균형감이 드러나요.","함께 머무는 공간에 두 사람만의 분위기와 이야기를 담고 싶어 할 수 있어요.","한 가지 인테리어에 머물기보다 새로운 분위기를 시도하는 재미를 즐길 수 있어요.","집을 돌보는 일도 단순한 관리가 아니라 공간을 내 취향대로 완성하는 과정일 수 있어요."],["둘이 함께 편하게 쉬는 시간이 하루의 중요한 보상이 될 수 있어요.","소중한 사람과의 시간을 위해 미리 준비하고 챙기는 수고를 아끼지 않을 수 있어요.","번거로운 일에 드는 시간을 줄여 둘이 함께할 순간을 늘리고 싶어 할 수 있어요.","둘이 함께 쓰는 공간에 두 사람의 취향을 담는 일이 즐거울 수 있어요.","관계를 소중히 여기면서도 함께할 시간과 각자의 시간을 조율하는 것이 중요해요.","함께 새로운 경험을 쌓는 일이 두 사람의 일상을 풍성하게 만들 수 있어요.","살림을 챙기는 마음이 결국 함께 사는 사람을 편안하게 해주고 싶은 마음과 이어질 수 있어요."],["밖에서 새로운 경험을 즐긴 뒤 집에서는 충분히 쉬는 균형을 원할 수 있어요.","새로운 것을 좋아하지만 준비를 갖춰 더 편하게 즐기려는 성향도 함께 보여요.","일상의 반복 업무를 줄여 새로운 경험에 쓸 시간을 확보하고 싶어 할 수 있어요.","취향이 바뀌어도 유연하게 사용할 수 있는 공간이나 물건에 끌릴 수 있어요.","혼자보다 함께 새로운 것을 경험할 때 즐거움이 커질 수 있어요.","새로운 시도를 즐기되 나만의 익숙한 생활 기반도 중요할 수 있어요.","평소 살림을 안정적으로 유지하기 때문에 새로운 일에 더 마음 편히 도전할 수 있어요."],["집이 정돈되어 있어야 편히 쉴 수 있다는 마음이 두 성향을 연결해 줘요.","생활을 미리 준비하고 실제로 돌보는 과정에서 안정감을 느낄 수 있어요.","살림에 손을 쓰는 보람은 느끼되 불필요한 반복은 줄이고 싶어 할 수 있어요.","직접 챙기는 살림에서 오래 쓸 가치와 관리 부담을 함께 따질 수 있어요.","내 손으로 가꾸는 공간에 취향이 반영될 때 만족감이 커질 수 있어요.","함께 사는 사람의 편안함을 생각하며 집을 돌보는 편일 수 있어요.","새로운 살림 방식을 시도하면서도 기본적인 생활의 안정감은 지키고 싶어 할 수 있어요."]];
