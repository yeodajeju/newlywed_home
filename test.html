ackground:#eee2dc;border-radius:20px;overflow:hidden;margin:16px 0 36px}.bar{height:100%;background:#bc766d;transition:width .2s}.step{color:var(--rose);font-size:12px;font-weight:700}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:white;margin:12px 0}.card h3{margin:4px 0 8px;font-size:19px}.card p{margin:0}.tag{display:inline-block;padding:6px 11px;background:#f8e8e1;border-radius:20px;font-size:12px;color:#aa6d63;margin:4px 5px 4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{padding:14px}.grid h3{font-size:17px}label{font-size:13px;display:block;margin-top:15px;font-weight:600}input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);padding:15px;border-radius:12px;background:white;font:inherit;margin-top:8px}input[type=checkbox]{accent-color:#bd756b}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;font-weight:400;line-height:1.7}.check input{margin-top:4px}.back{border:0;background:none;color:#9b7770;padding:10px 0}.small{font-size:12px;color:#a2928a}.hide{display:none!important}footer{margin-top:38px;text-align:center;font-size:11px;color:#ae9c94}.type-hero{text-align:center;padding:28px 14px;margin:18px 0;background:#fff1e9;border-radius:22px}.cute-icon{display:inline-grid;place-items:center;width:94px;height:94px;border-radius:25px;background:linear-gradient(140deg,#fff9dd,#f7cfcc);box-shadow:0 9px 19px #a66b5830,inset 0 2px 8px #fff;font-size:53px}.type-hero h2{font-size:22px;margin:13px 0 8px}.rec{border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;background:#fff}.rec p{margin:7px 0 0}.report-nav{margin-top:30px}.privacy-panel{border:1px solid #eadbd5;border-radius:18px;background:#fff;padding:18px 17px;margin:24px 0 8px}.privacy-head{padding-bottom:12px;border-bottom:1px solid #f0e5df}.privacy-kicker{font-size:10px;letter-spacing:1.8px;font-weight:700;color:#bf756c}.privacy-head h3{font:700 16px 'Noto Sans KR',sans-serif;margin:6px 0}.privacy-h /* Editorial result design: calmer hierarchy and more readable long-form copy */
:root{--ink:#3d3533;--rose:#b76f65;--line:#eaded8}
body{background:#f5eeea}
main{box-shadow:0 18px 70px #65463a14}
.report-view .eyebrow{letter-spacing:2.7px;font-size:10px}
.report-view .type-hero{background:linear-gradient(155deg,#fff3ed 0%,#f8eae3 100%);border:1px solid #f1e0d7;padding:34px 19px;margin:18px 0 28px}
.report-view .type-hero h2{font-size:23px;line-height:1.6;letter-spacing:-.7px}
.report-view .type-hero p{max-width:290px;margin:10px auto 0;line-height:1.8}
.report-view .card{padding:25px 22px;margin:16px 0;border-radius:21px;box-shadow:0 7px 25px #6c4a3610}
.report-view .card h3{font-size:19px;letter-spacing:-.6px;line-height:1.55;margin:0 0 16px}
.report-view .card p{font-size:14px;line-height:2.05;color:#6d5e59;letter-spacing:-.2px;word-break:keep-all}
.report-view .result-section-title{font:700 21px/1.55 'Noto Serif KR',serif;letter-spacing:-.8px;margin:36px 0 18px}
.report-view .rec-list{display:grid;gap:15px}
.report-view .rec-list .rec{position:relative;margin:0;padding:24px 21px;border-radius:20px;box-shadow:0 7px 25px #6c4a360c}
.report-view .rec-list .rec>b{font-size:19px;line-height:1.5;margin-bottom:15px;letter-spacing:-.4px}
.report-view .rec-list .rec-evidence{background:#fcf5f1;border-radius:14px;padding:18px;color:#6d5b55;font-size:14px;line-height:1.85}
.report-view .rec-reason-label{color:#b3746b;font-size:11px;letter-spacing:.7px;opacity:1;margin:0 0 7px}
.report-view .rec-list .rec-evidence p{font-size:14px;line-height:1.85;margin:0 0 18px;color:#675954;word-break:keep-all}
.report-view .rec-list .rec-evidence p:last-child{margin-bottom:0}
.report-view .rec-list .rec-reason-label:nth-of-type(2){border-top:1px solid #eadbd3;padding-top:14px}
.report-view .report-nav{margin-top:30px}
.report-view .primary{min-height:54px;box-shadow:0 7px 16px #b76f6526}
@media(max-width:420px){.report-view .card{padding:23px 19px}.report-view .rec-list .rec{padding:21px 18px}.report-view .card p{font-size:13.5px}.report-view .rec-list .rec-evidence p{font-size:13.5px}}
.comparison-list{display:grid;gap:13px;margin:14px 0}.comparison-item{background:#fdf8f5;border:1px solid #f0e5df;border-radius:15px;padding:16px}.comparison-number{font:700 10px 'DM Sans',sans-serif;letter-spacing:1.5px;color:#b77b70;margin-bottom:8px}.comparison-question{font-weight:700;font-size:14px;line-height:1.65;margin-bottom:10px;word-break:keep-all}.comparison-shared{background:#fff;border-radius:9px;padding:11px 12px;color:#765b53;font-size:13px;line-height:1.65;word-break:keep-all}.comparison-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.comparison-pair>div{background:#fff;border-radius:9px;padding:11px;min-width:0}.comparison-pair span{display:inline-block;color:#b57469;font-size:11px;font-weight:700;margin-bottom:5px}.report-view .comparison-pair p{font-size:12px;line-height:1.7;margin:0}.report-view .comparison-insight{border-top:1px solid #efe3dc;margin-top:17px;padding-top:16px;color:#655751;font-size:13.5px;line-height:1.9}.report-view .comparison-empty{font-size:13px;color:#877771}@media(max-width:360px){.comparison-pair{grid-template-columns:1fr}} .report-view .closing-headline{font-weight:750;font-size:18px;line-height:1.6;letter-spacing:-.5px;color:#5c4540;margin:0 0 12px;word-break:keep-all} .key-advice{margin-top:22px;padding-top:19px;border-top:1px solid var(--line);text-align:center}.key-advice-label{display:block;color:#ae7066;font-size:12px;font-weight:700;letter-spacing:.2px;margin-bottom:10px}.key-advice strong{display:block;font-size:21px;line-height:1.65;letter-spacing:-.6px;color:#443737;font-weight:800;word-break:keep-all}</style></head><body><main><div id="app"></div></main><script>
const questions=[

const products=['STEM 얼음정수 냉장고','식기세척기','워시콤보','로봇청소기','스타일러','바스에어','OLED TV','스탠바이미','김치냉장고','드로어 냉장고','인덕션','광파오븐'];

const state={page:'home',person:0,index:0,names:['',''],answers:[[],[]]};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(s,fn,cl='primary'){return `<button class="${cl}" onclick="${fn}">${s}</button>`}function oldRender(){let h='';if(state.page==='home')h=`<section class="hero"><div class="eyebrow">OUR NEWLYWED STORY</div><div class="ornament">♡ ✳</div><span class="pill">두 사람이 함께 만드는 우리 집 이야기</span><h1>우리의<br>신혼생활은<br>어떤 모습일까?</h1><p>같은 집, 서로 다른 취향.<br>스무 가지 질문으로 발견하는 우리 둘의 일상.</p>${btn('우리 이야기 시작하기','start()')}<p class="small">신랑님 20문항 → 신부님 20문항</p></section>`;

const applianceStory={"바스에어":"욕실도 단순히 씻는 공간을 넘어 온도와 쾌적함까지 신경 쓰고 싶은 생활이 보여요. 바스에어는 추운 날 욕실 온도와 샤워 후 습기 관리에 도움을 주어, 보다 쾌적하고 위생적인 욕실 환경을 만드는 데 어울려요.","식기세척기":"식사를 즐기는 시간만큼 식사 후 여유도 중요하겠어요. 식기세척기는 설거지에 드는 시간과 에너지를 줄여, 즐거운 한 끼가 뒷정리의 부담으로 이어지지 않도록 도와줘요.","로봇청소기":"집에서 쉬는 시간을 청소에 모두 쓰고 싶지는 않을 거예요. 로봇청소기는 반복되는 바닥 청소의 수고를 덜어, 집을 관리하는 부담과 휴식 사이의 균형을 맞추는 데 도움이 돼요.","워시콤보":"세탁을 여러 단계로 챙기는 일이 번거롭게 느껴질 수 있어요. 워시콤보는 세탁부터 건조까지 이어지는 과정을 간소화해, 빨래에 신경 쓰는 횟수를 줄이는 데 도움을 줘요.","스타일러":"좋아하는 옷을 오래 입으면서도 매번 세탁하는 부담은 줄이고 싶은 생활에 어울려요. 스타일러는 자주 입는 옷을 상태에 맞게 관리하는 데 도움을 줘요.","OLED TV":"집에서 영화나 드라마를 즐기는 시간이 소중하다면, 화면을 함께 바라보는 순간의 몰입감도 중요하겠어요. OLED TV는 둘이 보내는 영상 감상 시간을 더욱 풍성하게 만들어줘요.","스탠바이미":"집에서 쉬는 자리가 늘 같을 필요는 없겠죠. 스탠바이미는 원하는 공간으로 화면을 옮겨, 그날의 생활 동선과 기분에 맞춰 콘텐츠를 즐길 수 있게 해줘요.","STEM 얼음정수 냉장고":"시원한 음료를 즐기거나 손님을 자주 맞이한다면 음료를 준비하는 과정도 간편할수록 좋아요. 얼음과 물을 따로 챙기는 수고를 줄여 일상의 편리함을 더해줘요.","김치냉장고":"식재료를 넉넉히 준비해 두는 생활이라면 보관 방식도 중요한 살림의 일부예요. 김치냉장고는 재료에 맞는 보관 공간을 마련해 계획적인 식재료 관리를 도와줘요.","드로어 냉장고":"주방에서 자주 쓰는 재료를 편하게 꺼낼 수 있다면 요리의 흐름도 한결 가벼워져요. 드로어 냉장고는 식재료를 구분해 보관하고 사용하는 동선을 편리하게 만들어줘요.","인덕션":"직접 요리하는 즐거움을 오래 유지하려면 조리 과정과 뒷정리도 편해야 해요. 인덕션은 화력 조절과 상판 관리를 간편하게 해 주방에서의 수고를 줄이는 데 도움을 줘요.","광파오븐":"익숙한 집밥에도 새로운 메뉴를 더해보고 싶다면 조리 방식의 선택지가 넓을수록 즐겁겠죠. 광파오븐은 여러 조리 방식을 활용해 집에서 만드는 음식의 폭을 넓혀줘요."};

}

const profileInsights=[["편안함을 원하는 마음이 생활 선택의 기준이 될 수 있어요. 중요한 건 아무것도 하지 않는 게 아니라, 나를 충전하는 시간을 지킬 여유를 만드는 일이에요.","휴식은 무작정 쉬는 시간보다, 일상에서 신경 쓸 일을 덜어냈을 때 더 만족스러울 수 있어요."],["미리 챙기는 습관은 단순히 꼼꼼한 성격이라기보다, 예상치 못한 불편에 시간을 빼앗기고 싶지 않은 마음과 연결돼요.","준비를 잘하는 만큼, 반복되는 일은 체계적으로 정리해 두었을 때 생활이 한결 편해질 수 있어요."],["일을 빠르게 끝내는 것 자체보다, 번거로운 과정을 줄여 중요한 일에 시간을 쓰는 걸 선호해요.","반복되는 집안일에 쓰는 시간을 줄이고, 그 시간을 쉬거나 좋아하는 일에 쓰고 싶은 편이에요."],["가격만 보는 소비보다는, 들인 비용만큼 오래 만족할 수 있는지를 중요하게 여길 가능성이 커요.","지금의 편리함과 오래 쓸 가치를 함께 따져보는 방식이 신혼집을 꾸릴 때도 기준이 될 수 있어요."],["예쁘다는 이유만으로 선택하기보다, 매일 마주하는 공간과 물건이 내 취향을 잘 담아내길 바라는 마음이 읽혀요.","집의 기능뿐 아니라 그 안에서 느끼는 분위기까지 생활의 만족도를 좌우할 수 있어요."],["함께하는 시간을 소중하게 여긴다는 건, 집을 단순한 휴식처보다 관계를 쌓는 공간으로 생각할 가능성이 있다는 뜻이에요.","편리한 집만큼이나 둘이 자연스럽게 마주하고 이야기를 나눌 수 있는 환경이 중요해질 수 있어요."],["새로운 경험을 찾는 마음은 변화를 좋아한다는 말보다, 익숙한 일상 속에서도 발견할 거리를 남겨두고 싶다는 뜻에 가까워요.","집에서도 늘 같은 방식으로 쉬기보다, 그날의 기분에 맞춰 시간을 보내는 걸 좋아할 수 있어요."],["집안일을 스스로 챙기고 생활을 정돈해 둘 때 만족감을 느끼는 편이에요.","손이 많이 가는 집보다, 돌보는 수고에 비해 일상이 편안하게 유지되는 집이 더 잘 맞을 수 있어요."]];
const profileCombinations=[["쉬는 시간을 지키려면 미리 정리해 둘 것이 무엇인지부터 생각하는 편일 수 있어요.","편하게 쉬고 싶기에 반복되는 집안일을 간단하게 만드는 선택에 끌릴 수 있어요.","여유를 중요하게 여기면서도 불필요한 지출은 줄이고 싶은 마음이 함께 보여요.","휴식의 질은 공간의 분위기와 사용감에도 영향을 받을 수 있어요.","혼자 충전하는 시간과 둘이 함께하는 시간을 모두 소중히 여길 수 있어요.","집 안에서 충분히 쉬되, 가끔은 새로운 자극으로 기분을 전환하는 방식이 어울려요.","집을 잘 돌보는 이유도 결국 그 안에서 마음 편히 쉬기 위해서일 수 있어요."],["계획을 세우는 목적이 바쁜 일정을 늘리는 것이 아니라, 쉬는 시간을 확보하는 데 있을 수 있어요.","준비는 꼼꼼히 하되 실행 과정은 최대한 간단하게 만들고 싶은 조합이에요.","당장 저렴한 선택보다 앞으로의 관리 비용까지 예상할 수 있는 선택에 마음이 갈 수 있어요.","분위기를 중요하게 생각하면서도 공간의 쓰임새는 미리 따져보고 싶어 할 수 있어요.","둘이 함께하는 시간을 더 잘 즐기기 위해 작은 준비를 아끼지 않을 수 있어요.","새로운 경험을 좋아하되 준비가 되어 있을 때 더 마음껏 즐길 수 있어요.","일상을 체계적으로 꾸리는 것과 직접 살림을 돌보는 즐거움이 만나는 조합이에요."],["시간을 아껴서 결국 충분히 쉬고 싶은 마음이 드러나요.","해야 할 일을 예측해 두고 실제 과정은 단순하게 만드는 데 만족을 느낄 수 있어요.","편리하다는 이유만으로 고르기보다, 아끼는 시간에 비해 비용이 적절한지도 따질 수 있어요.","기능과 디자인 중 하나만 고르기보다, 매일 편하게 쓰면서 보기에도 좋은 물건을 원할 수 있어요.","반복되는 일을 간소화해 둘이 함께할 시간을 늘리는 데 의미를 둘 수 있어요.","번거로운 일은 줄이고, 남는 에너지는 새로운 경험에 쓰고 싶어 할 수 있어요.","살림을 직접 챙기되 꼭 사람이 해야 할 일과 줄여도 되는 일을 구분하는 편일 수 있어요."],["꼭 필요한 곳에만 비용을 쓰고, 그 덕분에 마음 편히 쉬는 생활을 선호할 수 있어요.","계획적으로 비교하는 습관이 장기적으로 만족할 소비를 돕는 조합이에요.","절약 자체보다 시간을 아끼는 효과까지 따져 실속을 판단할 수 있어요.","오래 써도 질리지 않을 디자인과 활용도를 함께 고려할 수 있어요.","함께 쓰는 물건일수록 두 사람 모두에게 가치가 있는지 살피는 편일 수 있어요.","새로운 것을 시도하되 비용과 활용 가능성을 먼저 따져볼 수 있어요.","살림을 챙기면서도 관리 비용과 오래 쓸 수 있는지를 꼼꼼히 생각할 수 있어요."],["편안하게 쉬는 공간도 내 취향에 맞아야 비로소 온전히 쉬는 기분이 들 수 있어요.","마음에 드는 분위기를 만들기 위해 공간과 물건을 신중하게 계획할 수 있어요.","보기 좋은 것뿐 아니라 사용하기 편해야 오래 만족하는 조합이에요.","마음에 드는 물건이라도 오래 쓸 수 있는지 살피는 균형감이 드러나요.","함께 머무는 공간에 두 사람만의 분위기와 이야기를 담고 싶어 할 수 있어요.","한 가지 인테리어에 머물기보다 새로운 분위기를 시도하는 재미를 즐길 수 있어요.","집을 돌보는 일도 단순한 관리가 아니라 공간을 내 취향대로 완성하는 과정일 수 있어요."],["둘이 함께 편하게 쉬는 시간이 하루의 중요한 보상이 될 수 있어요.","소중한 사람과의 시간을 위해 미리 준비하고 챙기는 수고를 아끼지 않을 수 있어요.","번거로운 일에 드는 시간을 줄여 둘이 함께할 순간을 늘리고 싶어 할 수 있어요.","둘이 함께 쓰는 공간에 두 사람의 취향을 담는 일이 즐거울 수 있어요.","관계를 소중히 여기면서도 함께할 시간과 각자의 시간을 조율하는 것이 중요해요.","함께 새로운 경험을 쌓는 일이 두 사람의 일상을 풍성하게 만들 수 있어요.","살림을 챙기는 마음이 결국 함께 사는 사람을 편안하게 해주고 싶은 마음과 이어질 수 있어요."],["밖에서 새로운 경험을 즐긴 뒤 집에서는 충분히 쉬는 균형을 원할 수 있어요.","새로운 것을 좋아하지만 준비를 갖춰 더 편하게 즐기려는 성향도 함께 보여요.","일상의 반복 업무를 줄여 새로운 경험에 쓸 시간을 확보하고 싶어 할 수 있어요.","취향이 바뀌어도 유연하게 사용할 수 있는 공간이나 물건에 끌릴 수 있어요.","혼자보다 함께 새로운 것을 경험할 때 즐거움이 커질 수 있어요.","새로운 시도를 즐기되 나만의 익숙한 생활 기반도 중요할 수 있어요.","평소 살림을 안정적으로 유지하기 때문에 새로운 일에 더 마음 편히 도전할 수 있어요."],["집이 정돈되어 있어야 편히 쉴 수 있다는 마음이 두 성향을 연결해 줘요.","생활을 미리 준비하고 실제로 돌보는 과정에서 안정감을 느낄 수 있어요.","살림에 손을 쓰는 보람은 느끼되 불필요한 반복은 줄이고 싶어 할 수 있어요.","직접 챙기는 살림에서 오래 쓸 가치와 관리 부담을 함께 따질 수 있어요.","내 손으로 가꾸는 공간에 취향이 반영될 때 만족감이 커질 수 있어요.","함께 사는 사람의 편안함을 생각하며 집을 돌보는 편일 수 있어요.","새로운 살림 방식을 시도하면서도 기본적인 생활의 안정감은 지키고 싶어 할 수 있어요."]];


const storyTopics=[
[0,['두 분은 집에서 보내는 시간을 에너지를 채우는 중요한 순간으로 바라보는 편이에요. 신혼집은 단순한 잠자리보다 함께 쉬고 즐길 수 있는 장소가 되면 좋겠어요.','두 분은 새로운 경험을 찾아 움직일 때 활력을 얻는 편이에요. 신혼집은 바깥에서 얻은 이야기를 나누고 다음 하루를 준비하는 거점이 될 수 있어요.'],['신랑님은 집에서 충전하는 시간을, 신부님은 밖에서 새로운 경험을 찾는 시간을 선호해요. 어느 한쪽의 방식이 정답은 아니니 쉬는 주말과 활동적인 주말을 함께 정해보는 건 어떨까요?','신부님은 집에서 충전하는 시간을, 신랑님은 밖에서 새로운 경험을 찾는 시간을 선호해요. 어느 한쪽의 방식이 정답은 아니니 쉬는 주말과 활동적인 주말을 함께 정해보는 건 어떨까요?']],
[5,['두 분은 직접 차리는 식탁에서 만족감을 얻는 편이에요. 중요한 건 요리 자체뿐 아니라 식사 준비와 정리까지 포함한 하루의 흐름이겠죠.','두 분은 식사 준비에 드는 시간을 줄이고 맛있는 식사를 즐기는 데 집중하는 편이에요. 함께 먹는 시간을 더 가볍게 만드는 생활 방식이 잘 맞을 수 있어요.'],['신랑님은 집밥을 즐기고 신부님은 외식이나 배달을 선호해요. 메뉴를 정하는 것보다 요리에 드는 시간과 정리 부담을 어떻게 나눌지 먼저 이야기해 보면 좋겠어요.','신부님은 집밥을 즐기고 신랑님은 외식이나 배달을 선호해요. 메뉴를 정하는 것보다 요리에 드는 시간과 정리 부담을 어떻게 나눌지 먼저 이야기해 보면 좋겠어요.']],
[8,['두 분은 정돈된 공간에서 마음이 편안해지는 편이에요. 청결은 그 자체가 목표라기보다 집에서 누리는 여유를 위한 준비일 수 있어요.','두 분은 완벽하게 정돈된 집보다 지금 누리는 휴식에 조금 더 너그러워요. 함께 지내며 서로 부담스럽지 않은 관리 기준을 찾는 것이 중요하겠어요.'],['신랑님은 정리 후 휴식을, 신부님은 우선 휴식을 선택하는 편이에요. 두 분이 편안함을 느끼는 순서가 다른 만큼 작은 정리 기준을 함께 정해두면 도움이 될 수 있어요.','신부님은 정리 후 휴식을, 신랑님은 우선 휴식을 선택하는 편이에요. 두 분이 편안함을 느끼는 순서가 다른 만큼 작은 정리 기준을 함께 정해두면 도움이 될 수 있어요.']],

{q:2,same:['두 사람 모두 피곤한 날에는 일단 쉬어야 에너지가 돌아오는 편이에요. 작은 집안일이 남아 있어도 휴식이 죄책감이 되지 않도록 최소한의 관리 기준을 정해두면 좋아요.','두 사람 모두 할 일을 마쳐야 온전히 쉴 수 있는 편이에요. 집안일의 완료 기준을 공유하면 서로의 수고를 알아보기 쉬운 조합이에요.'],diff:'한 사람은 먼저 쉬어야 움직일 힘이 나고 다른 사람은 일을 끝내야 마음이 놓여요. 같은 휴식을 원하지만 도착하는 순서가 다르므로, 꼭 오늘 끝낼 일만 함께 정하는 방식이 유용하겠어요.'},
{q:12,same:['두 사람 모두 집이 정돈되어 있을 때 편안함을 느껴요. 청결에 대한 공통 기준은 강점이지만 모든 집안일을 완벽하게 해야 한다는 부담으로 이어지지 않도록 주의하면 좋아요.','두 사람은 약간의 어질러짐에 관대한 편이에요. 완벽한 정돈보다 지금의 생활을 즐길 여유가 강점이지만, 최소한의 청소 주기는 함께 정해두면 좋아요.'],diff:'한 사람은 먼지와 어질러짐이 눈에 띄고 다른 사람은 크게 개의치 않아요. 어느 쪽이 더 성실한지가 아니라 편안함의 기준이 다른 것이므로, 꼭 관리할 공간과 주기를 구체적으로 합의해 보세요.'},
{q:23,same:['두 사람 모두 역할을 나누고 각자 책임지는 방식에서 안정감을 느껴요. 서로 잘하는 일을 맡되 한쪽에 부담이 쏠리지 않는지 가끔 확인하면 좋아요.','두 사람은 함께 움직이며 집안일을 마치는 방식에 더 익숙해요. 일을 함께하는 시간이 협력의 경험이 될 수 있지만 일정이 다를 때의 예외도 정해두면 편하겠어요.'],diff:'한 사람은 역할을 명확히 나누고 싶고 다른 사람은 함께하는 과정을 선호해요. 역할은 정하되 주말에는 함께 처리하는 일 하나를 남겨두는 절충안도 가능하겠어요.'},
{q:24,same:['두 사람은 취향이 다를 때도 공통의 만족을 찾으려는 편이에요. 함께 결정하는 힘이 있지만 사소한 선택까지 매번 합의하려고 하면 피곤해질 수 있어요.','두 사람은 각자의 취향을 존중하는 데 익숙해요. 같은 집에서 모든 선택이 같을 필요는 없다는 점이 강점이며, 함께 사용하는 공간의 기준만 따로 정하면 좋아요.'],diff:'한 사람은 둘 다 만족하는 합의점을, 다른 사람은 각자의 선택을 존중하는 방식을 편하게 여겨요. 공동으로 쓰는 물건은 함께 정하고 개인적인 취향은 각자 선택하도록 경계를 나누면 좋아요.'},
{q:22,same:['두 사람 모두 중요한 일을 미리 준비하는 편이에요. 계획의 힘을 살리면서도 예상 밖의 상황을 받아들일 여백을 남겨두면 더 편안하겠어요.','두 사람은 큰 방향을 정한 뒤 상황에 맞춰 움직이는 편이에요. 즉흥적인 즐거움은 강점이지만 중요한 날짜와 예산만큼은 함께 확인해두면 좋아요.'],diff:'한 사람은 준비가 되어야 안심하고 다른 사람은 상황에 맞게 움직이는 것이 편해요. 날짜와 예산 같은 큰 기준만 먼저 합의하고 세부 방법은 각자 맡는 것이 좋아요.'},
{q:0,same:['두 사람 모두 직접 만든 식사에서 만족을 느껴요. 함께 먹는 즐거움을 오래 유지하려면 요리뿐 아니라 장보기와 뒷정리의 부담도 균형 있게 나누는 것이 중요하겠어요.','두 사람은 식사 준비의 수고를 덜고 맛있는 한 끼를 즐기는 데 가치를 둬요. 외식과 배달이 편리하더라도 예산과 식사 리듬을 함께 정하면 더 만족스러울 수 있어요.'],diff:'한 사람은 직접 요리하는 시간을, 다른 사람은 간편한 식사를 선호해요. 집밥의 횟수를 정하고 준비와 정리를 함께 나누면 서로의 방식을 존중할 수 있겠어요.'},
{q:3,same:['두 사람은 한 번 장을 볼 때 며칠 먹을 만큼 넉넉히 준비하는 편이에요. 계획적인 보관과 재고 확인이 생활을 편하게 만드는 열쇠가 될 수 있어요.','두 사람은 신선하게 먹을 만큼 조금씩 장을 보는 편이에요. 보관 부담이 적은 대신 장보기 횟수가 늘 수 있으니 편한 주기를 정하면 좋아요.'],diff:'한 사람은 넉넉히 비축하고 다른 사람은 신선하게 조금씩 구매하고 싶어 해요. 자주 먹는 재료만 넉넉히 사고 나머지는 소량 구매하는 방법이 잘 맞을 수 있어요.'},
{q:10,same:['두 사람은 집에서 쉬는 주말을 편안하게 느껴요. 아무것도 하지 않는 시간도 두 사람에게 필요한 회복이라는 점을 함께 이해할 수 있겠어요.','두 사람은 바깥에서 새로운 즐거움을 찾으며 활력을 얻어요. 주말의 경험을 함께 쌓되 집에서 쉬는 시간도 확보하면 좋아요.'],diff:'한 사람은 집에서 쉬어야 충전되고 다른 사람은 외출에서 활력을 얻어요. 주말마다 활동과 휴식의 비중을 미리 상의하면 서로의 기대를 맞추기 쉬워요.'},
{q:19,same:['두 사람은 물건을 고를 때 사용 편의성을 중요하게 생각해요. 신혼집을 꾸릴 때 자주 쓰는 기능부터 확인하면 만족도가 높을 수 있어요.','두 사람은 물건의 디자인과 취향을 중요하게 생각해요. 공간의 분위기를 함께 만들어가는 즐거움이 크지만 관리 편의성도 놓치지 않으면 좋아요.'],diff:'한 사람은 편리한 기능을, 다른 사람은 마음에 드는 디자인을 먼저 봐요. 필수 기능과 포기하기 어려운 디자인 조건을 각각 정한 뒤 비교하면 좋아요.'},
{q:20,same:['두 사람은 생활 동선과 공간 활용을 먼저 생각해요. 실제로 자주 움직이는 경로를 기준으로 집을 꾸미면 실용적인 만족이 커질 수 있어요.','두 사람은 집이 보여주는 분위기와 취향을 중요하게 여겨요. 오래 머무는 공간부터 두 사람의 취향을 함께 담아보면 좋아요.'],diff:'한 사람은 동선과 실용성을, 다른 사람은 공간의 분위기를 중요하게 생각해요. 자주 쓰는 공간은 편의성을 먼저 맞추고 시선이 머무는 곳에는 취향을 담아보세요.'},
{q:13,same:['두 사람은 반복되는 번거로움을 줄일 방법을 적극적으로 찾는 편이에요. 실제로 시간을 많이 쓰는 일부터 개선하면 생활의 여유를 체감하기 쉽겠어요.','두 사람은 익숙한 방식의 안정감도 소중히 여겨요. 새 도구를 들일 때는 기존 방식에서 무엇이 정말 불편한지부터 확인하면 만족스러울 거예요.'],diff:'한 사람은 새로운 도구로 불편을 해결하고 싶고 다른 사람은 익숙한 방식이 편해요. 바꾸었을 때 실제로 줄어드는 수고를 함께 확인하면 선택이 쉬워져요.'}
];
function crossPattern(a,b){
 const has=q=>a[q]!==b[q];
 if(has(2)&&has(12)){
  const rest=a[2]===0?'신랑':'신부',tidy=a[12]===0?'신랑':'신부';
  return '두 사람의 생활에서 조율이 필요한 부분은 청소 자체보다 집안일을 시작하는 시점일 수 있어요. '+rest+'님은 피곤할 때 먼저 쉬어야 다시 움직일 힘이 생기고, '+tidy+'님은 주변 상태가 정돈되어야 마음이 놓일 수 있죠. 한쪽의 휴식이 다른 쪽에는 미뤄진 일처럼 보이지 않도록, 매일 꼭 관리할 공간과 시간을 짧게 합의해 두면 좋아요.';
 }
 if(has(9)&&has(24))return '두 사람은 함께하는 시간과 개인의 취향을 존중하는 방식에서 차이가 있어요. 모든 시간을 함께 보내거나 모든 취향을 맞추기보다, 함께할 시간과 각자 즐길 시간을 구분하면 관계의 여유가 커질 수 있어요.';
 if(has(21)&&has(13))return '편리함에 돈을 쓸지, 익숙한 방식으로 비용을 아낄지에 대한 기준이 달라요. 새로운 가전을 고를 때 가격만 비교하기보다 실제로 줄어드는 집안일과 그 시간을 어떻게 쓸지 함께 이야기해 보세요.';
 if(has(22)&&has(23))return '한 사람에게는 준비의 순서가, 다른 사람에게는 함께 움직이는 과정이 중요할 수 있어요. 중요한 일정은 미리 합의하고 집안일의 실행 방식에는 여유를 남겨두면 좋아요.';
 return '';
}
function interpretedStory(r,a,b){
 const focus=[9,21,2,12,23,24,22,0,3,10,19,20,13];
 const same=focus.filter(i=>a[i]===b[i]),diff=focus.filter(i=>a[i]!==b[i]);
 const byQ=q=>interpretiveThemes.find(t=>t.q===q);
 const cards=indices=>indices.map(i=>({question:questions[i][0],groom:questions[i][a[i]+1],bride:questions[i][b[i]+1]}));
 const pickSame=same.slice(0,2),pickDiff=diff.slice(0,2);
 const common=pickSame.length?pickSame.map(q=>byQ(q).same[a[q]]).join(' '):'두 사람이 같은 선택을 한 핵심 생활 기준은 많지 않지만, 서로 다른 방식으로 일상을 풍성하게 만들 가능성이 있어요.';
 const different=pickDiff.length?pickDiff.map(q=>byQ(q).diff).join(' '):'핵심 생활 주제에서는 큰 차이가 드러나지 않았어요. 생활 환경이 달라질 때 서로의 생각을 확인하는 습관을 이어가면 좋아요.';
 const idx=Math.max(0,coupleTypes.findIndex(t=>t[0]===r.type[0]));
 const [headline,overview]=coupleTypeAnalysis[idx];
 const crossed=crossPattern(a,b);
 const bridge=pickSame.length&&pickDiff.length?'함께 중요하게 여기는 기준을 바탕으로 서로 다른 생활 방식에 여유를 주는 것이 두 분의 강점이 될 수 있어요.':pickSame.length?'서로 잘 맞는 기준이 있어도 실제 집안일과 소비에서는 역할과 예산을 구체적으로 정하는 과정이 중요해요.':'다른 답변이 많더라도 그 차이를 잘 알고 있다는 것 자체가 함께 생활을 꾸리는 출발점이 될 수 있어요.';
 const advice=crossed|| (pickDiff.length?byQ(pickDiff[0]).diff:pickSame.length?'공통된 취향을 유지하면서도 달라지는 생활 리듬을 한 달에 한 번쯤 이야기해 보세요.':'서로의 생활에서 중요한 기준을 한 가지씩 말해보세요.');
 const synthesis=headline+'|'+overview+' '+(crossed||bridge);const takeaway=crossed?crossed.split(/(?<=[.!?])\s+/).filter(Boolean).slice(-1)[0]:(pickDiff.length?practicalAdvice[pickDiff[0]]?.[0]:'서로 편안했던 순간과 불편했던 순간을 정기적으로 이야기해 보세요.');return {same:cards(pickSame),diff:cards(pickDiff),common,different,synthesis,advice,takeaway};
}
function interpretedPersonal(ind,ans){
 const i=ind.primary,j=ind.secondary;
 const anchors=[[2,10],[22,1],[13,21],[18,21],[19,20],[9,24],[10,5],[0,3]];
 const meanings=[
 ['피곤한 날에는 휴식을 먼저 선택하는 경향이 있어요. 쉴 시간을 지키는 것이 생활 만족도의 중요한 조건일 수 있어요.','할 일을 마쳐야 마음 편히 쉴 수 있어요. 하루의 끝을 정리하는 습관이 안정감을 줄 수 있겠어요.'],
 ['미리 계획하는 과정에서 마음이 놓이는 편이에요. 생활을 예측할 수 있을 때 새로운 일에도 여유를 낼 수 있겠어요.','상황에 따라 조정할 수 있는 여유를 선호해요. 큰 방향을 정하되 지나치게 촘촘한 계획은 부담스러울 수 있어요.'],

 ['여러 선택지를 비교하면서 오래 만족할 방법을 찾는 편이에요. 당장의 가격보다 납득할 수 있는 소비인지가 중요할 수 있어요.','시간이 조금 더 들더라도 비용을 아끼는 선택에서 만족을 느낄 수 있어요. 절약한 자원을 어디에 쓸지도 생활의 기준이 되겠어요.'],
 ['물건의 분위기와 취향이 일상의 즐거움을 만드는 편이에요. 매일 마주하는 공간에 나다운 요소가 있을 때 만족감이 커질 수 있어요.','생활 동선과 사용 편의성이 중요해요. 보기 좋은 공간도 실제로 쓰기 불편하다면 오래 만족하기 어려울 수 있어요.'],
 ['함께 보내는 시간이 관계를 가깝게 느끼는 방법일 수 있어요. 바쁜 날에도 짧게 대화할 여유를 남겨두는 것이 좋겠어요.','각자의 시간을 존중하는 것도 중요한 관계의 방식이에요. 혼자 충전할 수 있을 때 함께하는 시간도 더 편안해질 수 있어요.'],
 ['밖에서 새로운 경험을 찾는 과정이 활력이 될 수 있어요. 신혼집은 그 경험을 나누고 다시 충전하는 공간이 되면 좋겠어요.','집에서 보내는 시간도 충분히 즐거운 편이에요. 새로운 경험과 익숙한 휴식 사이에서 나에게 맞는 균형을 찾는 게 좋아요.'],
 ['직접 요리하고 생활을 챙기는 데서 만족감을 얻을 수 있어요. 다만 모든 일을 혼자 책임지지 않도록 역할을 나누는 것이 중요해요.','식사 준비의 수고를 줄이는 방식이 더 편안할 수 있어요. 자신에게 맞는 생활 리듬을 찾는 것이 중요해요.']
 ];
 const key=anchors[i][0],secondary=anchors[j][0];
 return {first:profileInsights[i][0]+' '+meanings[i][ans[key]]+' '+(key===2?'휴식과 집안일의 순서를 스스로 정할 수 있는 환경이 잘 맞겠어요.':key===9?'혼자만의 시간과 함께하는 시간을 어떻게 나눌지 생각해보면 좋아요.':'이런 생활 기준을 신혼집의 실제 선택에 적용해보면 좋아요.'),
 second:profileInsights[j][1]+' '+meanings[j][ans[secondary]]+' 서로 다른 두 기준은 모순이라기보다 상황에 따라 선택할 수 있는 생활의 균형점이에요.'};
}
coupleDeep=interpretedStory;
personalDeep=interpretedPersonal;

/* 실험용 3단계 리포트: 신랑 → 신부 → 부부 총평과 가전 추천 */
const originalResultContent=reportPage;
function personalExtra(who){
 const a=state.answers[who];
 // The three sections use distinct question clusters so the same trait is not paraphrased repeatedly.
 const scenes=[
  a[12]===0&&a[23]===0?'집의 상태가 눈에 들어오는 편이지만, 그 기준을 혼자 책임지고 싶다는 뜻은 아니에요. 정리할 일의 기준을 함께 정하면 훨씬 편안한 일상이 될 수 있어요.':
  a[12]===0&&a[23]===1?'집이 정돈되어 있을 때 편안함을 느끼면서도, 집안일은 함께 움직이는 쪽을 선호해요. 누가 더 많이 했는지보다 같이 생활을 가꾼다는 감각이 중요할 수 있겠어요.':
  a[12]===1&&a[23]===0?'집이 조금 어질러져 있어도 크게 신경 쓰지 않지만, 해야 할 일의 책임은 분명하게 나누는 편이에요. 느긋함과 무책임함은 다르다는 걸 보여주는 조합이에요.':
  '집안의 작은 흐트러짐에는 관대하고, 필요할 때는 함께 손을 보태는 생활에 가까워요. 정해진 방식보다 그날의 상황에 맞춰 움직일 여지가 있으면 좋겠어요.'
 ];
 const scene=scenes[0];
 const twist=a[22]===0&&a[18]===1?'생활의 큰 일정은 미리 준비하지만, 마음에 드는 물건은 오래 망설이지 않을 수 있어요. 계획적인 사람에게도 직감이 통하는 영역이 있는 거죠.':
 a[22]===1&&a[18]===0?'일정은 유연하게 바꿔도 구매 앞에서는 비교하고 확인하는 시간을 아끼지 않아요. 즉흥적인 사람이라는 한마디로 설명하기 어려운 모습이에요.':
 a[14]===0&&a[15]===1?'마음에 드는 옷은 오래 입고 싶어 하면서도, 입었던 옷은 바로 세탁하는 쪽을 택해요. 물건을 아끼는 마음과 매일의 쾌적함을 함께 챙기는 취향이에요.':
 a[14]===1&&a[15]===0?'새로운 스타일을 즐기면서도 한 번 입은 옷을 무조건 세탁하지는 않아요. 변화를 좋아하는 취향과 생활에서의 실용적인 판단이 함께 나타나요.':
 a[19]===1&&a[20]===0?'물건 자체의 디자인도 중요하지만 공간을 꾸릴 때는 쓰기 편한 구성을 우선해요. 눈에 띄는 멋보다 매일 쓰는 사람의 동선을 더 중시할 수 있겠어요.':
 '하나의 기준이 모든 선택을 지배하지는 않아요. 일의 성격에 따라 신중함과 유연함의 비중을 다르게 두는 모습도 눈여겨볼 만해요.';
 const partner=a[9]===0&&a[24]===1?'함께 보내는 시간을 좋아한다고 해서 모든 취향을 맞추고 싶은 건 아니에요. 같이 있는 시간과 각자 좋아하는 것을 누릴 자유가 모두 필요할 수 있어요.':
 a[9]===1&&a[24]===0?'혼자 충전하는 시간은 필요하지만 중요한 선택에서는 두 사람이 납득할 답을 찾고 싶어 해요. 혼자 있고 싶다는 말이 상대와 거리를 두고 싶다는 뜻은 아닐 수 있어요.':
 a[9]===0?'일과가 끝난 뒤 짧게라도 함께 이야기하는 시간이 관계의 온도를 느끼는 방법일 수 있어요. 긴 대화가 아니어도 서로에게 집중하는 순간이 의미 있을 거예요.':
 '혼자 보내는 시간이 편안함을 회복하는 방식일 수 있어요. 그 시간을 존중받을 때 오히려 함께하는 순간에 더 마음을 쓸 여유가 생길 수 있겠어요.';
 return '<div class="card"><h3>🏡 함께 살 때 드러나는 생활 습관</h3><p>'+esc(scene)+'</p></div>'+
 '<div class="card"><h3>✨ 상대방도 몰랐던 나의 의외의 모습</h3><p>'+esc(twist)+'</p></div>'+
 '<div class="card"><h3>💌 상대방이 알아두면 좋은 점</h3><p>'+esc(partner)+'</p></div>';
}
reportPage=function(step){
 if(step===0||step===1){
  const who=step;
  let html=originalResultContent(who===0?1:2);
  const cut=html.indexOf('<h3>'+esc(state.names[who])+'님만의 취향을 반영한 추가 가전 추천</h3>');
  if(cut>=0)html=html.slice(0,cut);
  html=html.replace(/OUR NEWLYWED STORY · 0[1-3] \/ 03/,'OUR NEWLYWED STORY · 0'+(step+1)+' / 03');
  return html+personalExtra(who);
 }
 const r=coupleAnalyze(),a=state.answers[0],b=state.answers[1];
 let html=originalResultContent(0);
 const cut=html.indexOf('<h3>두 분의 라이프스타일에 어울리는 가전</h3>');
 if(cut>=0)html=html.slice(0,cut);
 html=html.replace(/OUR NEWLYWED STORY · 01 \/ 03/,'OUR NEWLYWED STORY · 03 / 03');
 const picks=r.both.filter(p=>recommendationNarrative(p,[a,b])).slice(0,3);
 const groom=rankedCandidates(a,null,picks).find(p=>!picks.includes(p)&&recommendationNarrative(p,[a]));
 const bride=rankedCandidates(b,null,[...picks,...(groom?[groom]:[])]).find(p=>!picks.includes(p)&&p!==groom&&recommendationNarrative(p,[b]));
 return html+'<h3 class="result-section-title">우리 부부에게 어울리는 가전</h3><p>두 사람의 생활 이야기를 바탕으로 함께 쓸 때 도움이 될 만한 제품을 골랐어요.</p>'+
 (picks.length?'<h3 class="result-section-title">우리 부부의 생활에 어울리는 추천 '+picks.length+'가지</h3>'+listProducts(picks,[a,b]):'<div class="card"><p>이번 응답만으로 공통 추천 근거가 충분한 제품은 없었어요.</p></div>')+
 '<h3 class="result-section-title">우리 각자의 취향저격 가전 꿀템</h3>'+
 '<div class="card"><h3>💝 '+esc(state.names[0])+'님만의 취향저격 가전 꿀템</h3>'+(groom?listProducts([groom],[a]):'<p>공통 추천과 겹치지 않는 추가 제품의 근거가 충분하지 않아요.</p>')+'</div>'+
 '<div class="card"><h3>💝 '+esc(state.names[1])+'님만의 취향저격 가전 꿀템</h3>'+(bride?listProducts([bride],[b]):'<p>공통 추천과 겹치지 않는 추가 제품의 근거가 충분하지 않아요.</p>')+'</div>'+
 '<p class="small">응답을 바탕으로 한 생활 제안이며, 구매를 전제로 하지 않아요.</p>';
};
